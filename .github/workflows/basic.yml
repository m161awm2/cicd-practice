name: docker image build & pod deploy

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 가져오기
        uses: actions/checkout@v3
      
      - name: 노드 js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: kind
        uses: helm/kind-action@v1
      
      - name: docker image 빌드
        run : docker build -t my-app .
      
      